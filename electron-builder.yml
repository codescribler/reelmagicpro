appId: com.reelmagic.app
productName: ReelMagic
directories:
  output: dist-app
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - "node_modules/ffmpeg-static/**"
  - "node_modules/ffprobe-static/**"
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
mac:
  icon: build/icon.png
  target:
    - dmg
linux:
  icon: build/icon.png
  target:
    - AppImage
publish:
  provider: github
  owner: Codescribler
  repo: reelmagicpro
