appId: com.reelmagic.app
productName: ReelMagic
directories:
  output: dist-app
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - "node_modules/ffmpeg-static/**"
  - "node_modules/ffprobe-static/**"
  # Bundled fonts for ffmpeg drawtext. ffmpeg runs as a separate process and
  # cannot read files from inside app.asar, so the font folder must be
  # unpacked. fontFilePath() rewrites app.asar → app.asar.unpacked at runtime
  # to find the file here.
  - "dist-electron/main/assets/**"
fileAssociations:
  - ext: rmproj
    name: ReelMagic Project
    description: ReelMagic Project File
    role: Editor
    icon: build/icon.ico
win:
  icon: build/icon.png
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
mac:
  icon: build/icon.png
  target:
    - dmg
linux:
  icon: build/icon.png
  target:
    - AppImage
publish:
  provider: github
  owner: Codescribler
  repo: reelmagicpro
