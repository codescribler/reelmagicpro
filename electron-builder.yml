appId: com.reelmagic.app
productName: ReelMagic
directories:
  output: dist-app
files:
  - dist/**
  - dist-electron/**
  - package.json
asarUnpack:
  - "node_modules/ffmpeg-static/**"
  - "node_modules/ffprobe-static/**"
win:
  target:
    - nsis
mac:
  target:
    - dmg
linux:
  target:
    - AppImage
